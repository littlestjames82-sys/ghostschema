[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostschema"
version = "0.1.0"
description = "GhostSchema: slice large API specifications (OpenAPI 3.x JSON, JSON Schema, GraphQL SDL outline) down to what a task touches, by $ref reachability. A GhostSlice companion."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ghostschema = "ghostschema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
